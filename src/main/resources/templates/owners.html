<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Владельцы телефонов</title></head>
<body>
<h1>Владельцы телефонов</h1>
<p th:if="${!owners.iterator().hasNext()}">Записей пока нет.</p>
<table th:if="${owners.iterator().hasNext()}">
    <thead><tr><th>ID</th><th>ФИО</th><th>Город</th><th>Телефон</th></tr></thead>
    <tbody><tr th:each="owner : ${owners}">
        <td th:text="${owner.id}">1</td>
        <td th:text="${owner.surname + ' ' + owner.name + ' ' + owner.patronymic}">Иванов Иван Иванович</td>
        <td th:text="${owner.city}">Москва</td>
        <td th:text="${owner.phone}">+7 900 000-00-00</td>
    </tr></tbody>
</table>
</body>
</html>
